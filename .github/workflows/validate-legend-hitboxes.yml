name: Validate legend hitboxes (fork only)

on:
  push:
    branches: [codex/validate-chartjs-legend-hitboxes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository_owner == 'pentaoa' && github.ref == 'refs/heads/codex/validate-chartjs-legend-hitboxes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 8.13.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Complete Chrome and Firefox suites without stopping at the first failed spec
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/chartjs-validation"
          xvfb-run --auto-servernum pnpm exec cross-env NODE_ENV=test karma start ./karma.conf.cjs --no-auto-watch --single-run --coverage --browsers chrome,firefox --grep 2>&1 | tee "$RUNNER_TEMP/chartjs-validation/browsers-full.log"
      - name: Compare the unchanged baseline on the same Firefox installation
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/chartjs-validation"
          source_path=src/plugins/plugin.legend.js
          patched_source="$RUNNER_TEMP/chartjs-validation/plugin.legend.patched.js"
          cp "$source_path" "$patched_source"
          trap 'cp "$patched_source" "$source_path"' EXIT
          git fetch --no-tags --depth=1 origin 6a86e238fac3d1ad35eb84b93e7804dfb5813f79
          git show "6a86e238fac3d1ad35eb84b93e7804dfb5813f79:$source_path" > "$source_path"
          xvfb-run --auto-servernum pnpm exec cross-env NODE_ENV=test karma start ./karma.conf.cjs --no-auto-watch --single-run --coverage --browsers firefox --grep controller.polarArea 2>&1 | tee "$RUNNER_TEMP/chartjs-validation/firefox-baseline-polar-area.log"
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chartjs-legend-validation
          path: ${{ runner.temp }}/chartjs-validation/
          retention-days: 7
